name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_deploy.yml"
  pull_request: # PR ではテストだけを実行する
    paths:
      - "backend/**"

permissions:
  id-token: write # OIDC のトークンを取得するために必要
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g npm@11 # package-lock.json を作った npm にそろえる（3-1）
      - run: npm ci
      - run: npm run lint
      - run: npm test # 失敗したら、ここで止まる（デプロイしない）

  deploy-dev:
    if: github.event_name == 'push' # main への push のときだけデプロイする
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with:
      env: dev
      app: api
